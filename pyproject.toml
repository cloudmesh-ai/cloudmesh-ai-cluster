[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudmesh-ai-cluster"

dynamic = ["version"]
description = "Extension cluster created by CME"
license = {text = "Apache-2.0"}
dependencies = [
    "click",
    "rich",
    "cloudmesh-ai-cmc",
] 
[tool.setuptools.dynamic]
version = {file = "VERSION"}

[project.entry-points."cloudmesh.ai.command"]
cluster = "command.cluster:register"

[tool.setuptools.packages.find]
where = ["src"]
include = ["command*"]

[tool.cloudmesh-ai]
category = "infrastructure"
status = "beta"
order = 40
